<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat Mobile Oficial</title>
    <!-- Ícones FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #090d16;
            --balloon-right: #111111; /* Preto */
            --balloon-left: #0078ff;  /* Azul */
            --text-light: #ffffff;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --glass-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%; height: 100%; height: 100dvh;
            overflow: hidden; background-color: #020617; color: var(--text-light);
        }

        .app-container {
            width: 100vw; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; position: relative;
            overflow: hidden; background-color: var(--bg-dark);
        }

        /* --- Tela de Login / Cadastro Overlay --- */
        .auth-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.96);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 300; display: flex; justify-content: center; align-items: center;
            padding: 20px; transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .auth-overlay.hidden {
            opacity: 0; visibility: hidden; pointer-events: none;
        }

        .auth-card {
            background: #1e293b; border: 1px solid var(--glass-border);
            border-radius: 24px; width: 100%; max-width: 380px; padding: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 20px;
        }

        .auth-tabs {
            display: flex; background: rgba(255,255,255,0.06);
            border-radius: 14px; padding: 4px; border: 1px solid var(--glass-border);
        }

        .auth-tab {
            flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 600;
            border-radius: 10px; cursor: pointer; color: var(--text-muted); transition: all 0.2s;
        }

        .auth-tab.active {
            background: var(--balloon-left); color: white;
            box-shadow: 0 2px 10px rgba(0, 120, 255, 0.4);
        }

        .auth-form { display: flex; flex-direction: column; gap: 14px; }
        .auth-form.hidden { display: none; }
        .auth-form h2 { font-size: 20px; font-weight: 700; text-align: center; }
        .auth-form p { font-size: 13px; color: var(--text-muted); text-align: center; margin-top: -8px; }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }

        .auth-input {
            width: 100%; padding: 12px 14px; background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border); border-radius: 12px;
            color: white; outline: none; font-size: 14px; transition: border-color 0.2s;
        }

        .auth-input:focus { border-color: var(--balloon-left); }

        .btn-auth {
            background: var(--balloon-left); color: white; border: none;
            padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: opacity 0.2s; margin-top: 6px;
        }

        .btn-auth:active { opacity: 0.85; }

        /* --- Cabecalho --- */
        .chat-header {
            background: var(--glass-bg); backdrop-filter: blur(16px);
            padding: 12px 16px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid var(--glass-border);
            z-index: 20; padding-top: max(12px, env(safe-area-inset-top));
        }

        .header-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }

        .avatar-wrapper { position: relative; }

        .avatar {
            width: 42px; height: 42px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.25); box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .status-dot {
            width: 12px; height: 12px; background-color: var(--accent-green);
            border-radius: 50%; position: absolute; bottom: 2px; right: 0;
            border: 2px solid var(--bg-dark); box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .user-details h3 { font-size: 16px; font-weight: 600; }
        .user-details span { font-size: 12px; color: var(--accent-green); display: flex; align-items: center; gap: 4px; }

        .header-actions { display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-size: 18px; }
        .header-actions i { cursor: pointer; padding: 6px; border-radius: 50%; transition: all 0.2s; }
        .header-actions i:hover { color: var(--text-light); background: rgba(255, 255, 255, 0.1); }

        /* --- Área de Chat & Papéis de Parede --- */
        .chat-body {
            flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column;
            gap: 12px; position: relative; transition: background 0.4s ease, background-image 0.4s ease;
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }

        .wp-dark-geometry {
            background-color: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.35) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(88, 28, 135, 0.25) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.85) 0px, transparent 100%),
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.015) 0, rgba(255, 255, 255, 0.015) 1px, transparent 0, transparent 20px);
        }

        .wp-cyberpunk {
            background-color: #0d0614;
            background-image: 
                radial-gradient(at 10% 20%, rgba(192, 38, 211, 0.25) 0px, transparent 40%),
                radial-gradient(at 90% 80%, rgba(6, 182, 212, 0.25) 0px, transparent 40%),
                radial-gradient(at 50% 50%, rgba(15, 11, 26, 0.9) 0px, transparent 100%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: cover, cover, cover, 30px 30px, 30px 30px;
        }

        .wp-aurora {
            background-color: #051412;
            background-image: 
                radial-gradient(at 20% 10%, rgba(16, 185, 129, 0.25) 0px, transparent 50%),
                radial-gradient(at 80% 90%, rgba(59, 130, 246, 0.3) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(3, 20, 26, 0.85) 0px, transparent 100%);
        }

        .wp-gold-luxury {
            background-color: #120e07;
            background-image: 
                radial-gradient(at 100% 0%, rgba(217, 119, 6, 0.2) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(180, 83, 9, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(20, 16, 10, 0.9) 0px, transparent 100%),
                repeating-linear-gradient(135deg, rgba(245, 158, 11, 0.02) 0, rgba(245, 158, 11, 0.02) 2px, transparent 0, transparent 15px);
        }

        .wp-midnight-minimal {
            background-color: #05070d;
            background-image: radial-gradient(circle at 50% 30%, rgba(30, 41, 59, 0.5) 0%, transparent 70%);
        }

        /* --- Balões de Mensagem --- */
        .message-row {
            display: flex; flex-direction: column; max-width: 82%; position: relative;
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.sent { align-self: flex-end; align-items: flex-end; }
        .message-row.received { align-self: flex-start; align-items: flex-start; }

        .bubble {
            padding: 11px 15px; border-radius: 18px; font-size: 14.5px;
            line-height: 1.42; word-break: break-word; position: relative;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        /* Balão Direito (Enviado) -> PRETO */
        .message-row.sent .bubble {
            background-color: var(--balloon-right); color: #ffffff;
            border-bottom-right-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.14);
        }

        /* Balão Esquerdo (Recebido) -> AZUL */
        .message-row.received .bubble {
            background-color: var(--balloon-left); color: #ffffff;
            border-bottom-left-radius: 4px; box-shadow: 0 4px 16px rgba(0, 120, 255, 0.3);
        }

        .bubble img {
            max-width: 100%; max-height: 260px; border-radius: 12px; margin-top: 8px;
            display: block; object-fit: cover; border: 1px solid rgba(255,255,255,0.1);
        }

        .file-card {
            display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.12);
            padding: 10px 14px; border-radius: 12px; text-decoration: none; color: white; margin-top: 6px;
            backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .meta-info {
            display: flex; align-items: center; gap: 5px; font-size: 10.5px;
            color: rgba(255, 255, 255, 0.65); margin-top: 4px; padding: 0 4px;
        }

        .message-actions {
            position: absolute; top: 50%; transform: translateY(-50%);
            display: none; gap: 8px; background: rgba(0,0,0,0.85);
            padding: 6px 10px; border-radius: 20px; font-size: 12px;
            border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(8px);
        }

        .message-row.sent:hover .message-actions { display: flex; left: -65px; }
        .message-actions i { cursor: pointer; color: #fff; transition: color 0.15s; }
        .message-actions i:hover { color: var(--balloon-left); }

        /* Rodapé */
        .chat-footer {
            background: var(--glass-bg); backdrop-filter: blur(16px);
            padding: 10px 14px; padding-bottom: max(10px, env(safe-area-inset-bottom));
            border-top: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 8px; z-index: 20;
        }

        .input-bar { display: flex; align-items: center; gap: 8px; }

        .btn-icon {
            background: none; border: none; color: var(--text-muted); font-size: 19px;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center;
            justify-content: center; width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
        }

        .btn-icon:hover { color: var(--text-light); background: rgba(255, 255, 255, 0.08); }

        .input-field {
            flex: 1; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 10px 16px; color: white; font-size: 14.5px; outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .input-field:focus { border-color: var(--balloon-left); background: rgba(255, 255, 255, 0.12); }

        .btn-send {
            background-color: var(--balloon-left); color: white; border: none;
            width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 14px rgba(0, 120, 255, 0.45); transition: transform 0.15s; flex-shrink: 0;
        }

        .btn-send:active { transform: scale(0.92); }

        /* Painel de Emojis */
        .emoji-picker {
            display: none; background: rgba(15, 23, 42, 0.96); border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 12px; max-height: 200px; overflow-y: auto;
            grid-template-columns: repeat(8, 1fr); gap: 6px; text-align: center; font-size: 22px; backdrop-filter: blur(12px);
        }

        .emoji-picker span { cursor: pointer; border-radius: 8px; padding: 4px; transition: background 0.15s; user-select: none; }
        .emoji-picker span:hover { background: rgba(255, 255, 255, 0.15); }

        /* Modais */
        .modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(10px); z-index: 200;
            justify-content: center; align-items: center;
        }

        .modal-content {
            background: #1e293b; padding: 24px; border-radius: 24px; width: 88%; max-width: 360px;
            border: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .modal-content h3 { font-size: 18px; text-align: center; font-weight: 600; }

        .modal-content input {
            width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border); border-radius: 12px; color: white; outline: none; font-size: 14px;
        }

        .modal-buttons { display: flex; gap: 10px; margin-top: 4px; }

        .btn-modal {
            flex: 1; padding: 12px; border-radius: 12px; border: none; cursor: pointer; font-weight: 600; font-size: 14px;
        }

        .btn-primary { background: var(--balloon-left); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; }

        .wallpaper-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            max-height: 240px; overflow-y: auto; padding: 4px;
        }

        .wp-option {
            height: 70px; border-radius: 12px; border: 2px solid transparent;
            cursor: pointer; display: flex; align-items: flex-end; padding: 8px;
            font-size: 11px; font-weight: 600; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: border-color 0.2s, transform 0.15s;
        }

        .wp-option:hover { transform: scale(1.02); }
        .wp-option.active { border-color: var(--balloon-left); }

        .toast {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: rgba(15, 23, 42, 0.95); border: 1px solid var(--balloon-left);
            padding: 10px 18px; border-radius: 20px; font-size: 13px; opacity: 0; transition: all 0.3s;
            pointer-events: none; z-index: 400; display: flex; align-items: center; gap: 8px;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <!-- Toast de Notificação -->
        <div id="toast" class="toast">
            <i class="fa-solid fa-bell" style="color: var(--balloon-left);"></i>
            <span id="toastText">Carregando...</span>
        </div>

        <!-- TELA DE AUTENTICAÇÃO (LOGIN / CADASTRO) -->
        <div class="auth-overlay" id="authOverlay">
            <div class="auth-card">
                <div class="auth-tabs">
                    <div class="auth-tab active" id="tabLoginBtn">Entrar</div>
                    <div class="auth-tab" id="tabRegisterBtn">Cadastrar</div>
                </div>

                <!-- Formulário: LOGIN -->
                <form class="auth-form" id="formLogin" onsubmit="event.preventDefault();">
                    <h2>Entrar no Chat</h2>
                    <p>Acesse com seu e-mail e senha</p>

                    <div class="input-group">
                        <label>E-mail</label>
                        <input type="email" id="loginEmail" class="auth-input" placeholder="seu@email.com" required>
                    </div>

                    <div class="input-group">
                        <label>Senha</label>
                        <input type="password" id="loginPassword" class="auth-input" placeholder="••••••••" required>
                    </div>

                    <button type="button" class="btn-auth" id="btnLoginSubmit">Entrar</button>
                </form>

                <!-- Formulário: CADASTRO -->
                <form class="auth-form hidden" id="formRegister" onsubmit="event.preventDefault();">
                    <h2>Criar Conta</h2>
                    <p>Cadastre-se para usar o chat</p>

                    <div class="input-group">
                        <label>Nome Completo</label>
                        <input type="text" id="regName" class="auth-input" placeholder="Seu Nome" required>
                    </div>

                    <div class="input-group">
                        <label>E-mail</label>
                        <input type="email" id="regEmail" class="auth-input" placeholder="seu@email.com" required>
                    </div>

                    <div class="input-group">
                        <label>Senha (Mín. 6 caracteres)</label>
                        <input type="password" id="regPassword" class="auth-input" placeholder="••••••••" required>
                    </div>

                    <div class="input-group">
                        <label>Foto de Perfil URL (Opcional)</label>
                        <input type="url" id="regAvatar" class="auth-input" placeholder="https://...">
                    </div>

                    <button type="button" class="btn-auth" id="btnRegisterSubmit">Cadastrar</button>
                </form>
            </div>
        </div>

        <!-- CABEÇALHO DO CHAT -->
        <header class="chat-header">
            <div class="header-info" id="btnOpenProfile">
                <div class="avatar-wrapper">
                    <img id="headerAvatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" class="avatar" alt="Perfil">
                    <div class="status-dot"></div>
                </div>
                <div class="user-details">
                    <h3 id="headerName">Carregando...</h3>
                    <span><i class="fa-solid fa-circle" style="font-size: 7px;"></i> Online</span>
                </div>
            </div>
            <div class="header-actions">
                <i class="fa-solid fa-expand" id="btnFullscreen" title="Tela Cheia (Fullscreen)"></i>
                <i class="fa-solid fa-palette" id="btnOpenWallpaper" title="Papéis de Parede"></i>
                <i class="fa-solid fa-right-from-bracket" id="btnLogout" title="Sair da Conta"></i>
            </div>
        </header>

        <!-- ÁREA CENTRAL DE MENSAGENS -->
        <main class="chat-body wp-dark-geometry" id="chatBody"></main>

        <!-- PAINEL DE EMOJIS LIBERADOS -->
        <div class="emoji-picker" id="emojiPicker"></div>

        <!-- RODAPÉ DO CHAT -->
        <footer class="chat-footer">
            <div class="input-bar">
                <button class="btn-icon" id="btnEmojiToggle" title="Emojis"><i class="fa-regular fa-face-smile"></i></button>
                <button class="btn-icon" id="btnAttachFile" title="Anexar Arquivo"><i class="fa-solid fa-paperclip"></i></button>
                <input type="file" id="fileInput" hidden>
                
                <input type="text" id="messageInput" class="input-field" placeholder="Digite uma mensagem...">
                
                <button class="btn-send" id="btnSendMessage"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </footer>

        <!-- Modal Editar Perfil -->
        <div id="profileModal" class="modal">
            <div class="modal-content">
                <h3>Editar Seu Perfil</h3>
                <input type="text" id="editName" placeholder="Seu Nome">
                <input type="text" id="editAvatar" placeholder="URL da Foto de Perfil">
                <div class="modal-buttons">
                    <button class="btn-modal btn-secondary" id="btnCancelProfile">Cancelar</button>
                    <button class="btn-modal btn-primary" id="btnSaveProfile">Salvar</button>
                </div>
            </div>
        </div>

        <!-- Modal Selecionar Papel de Parede -->
        <div id="wallpaperModal" class="modal">
            <div class="modal-content">
                <h3>Papéis de Parede Sofisticados</h3>
                <div class="wallpaper-grid">
                    <div class="wp-option wp-dark-geometry active" data-theme="wp-dark-geometry">Dark Geometry</div>
                    <div class="wp-option wp-cyberpunk" data-theme="wp-cyberpunk">Cyber Neon</div>
                    <div class="wp-option wp-aurora" data-theme="wp-aurora">Aurora Emerald</div>
                    <div class="wp-option wp-gold-luxury" data-theme="wp-gold-luxury">Gold Luxury</div>
                    <div class="wp-option wp-midnight-minimal" data-theme="wp-midnight-minimal">Midnight Dark</div>
                </div>
                <input type="text" id="customWpUrl" placeholder="URL de imagem externa (https://...)">
                <div class="modal-buttons">
                    <button class="btn-modal btn-secondary" id="btnCloseWallpaper">Fechar</button>
                    <button class="btn-modal btn-primary" id="btnApplyCustomWp">Aplicar Imagem</button>
                </div>
            </div>
        </div>

        <!-- Modal Editar Mensagem -->
        <div id="editMessageModal" class="modal">
            <div class="modal-content">
                <h3>Editar Mensagem</h3>
                <input type="text" id="editMessageText">
                <div class="modal-buttons">
                    <button class="btn-modal btn-secondary" id="btnCancelEditMsg">Cancelar</button>
                    <button class="btn-modal btn-primary" id="btnSaveEditMsg">Atualizar</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
            signOut, onAuthStateChanged, updateProfile 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Configuração Oficial do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDQ3ebWx62hta35KRdihRbtwJoxrlUtxiM",
            authDomain: "chat-e797a.firebaseapp.com",
            projectId: "chat-e797a",
            storageBucket: "chat-e797a.firebasestorage.app",
            messagingSenderId: "104946241159",
            appId: "1:104946241159:web:93acbec71b40ec46c87222"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let unsubscribeRealtime = null;
        let editingMessageDocId = null;

        const emojiList = [
            "😀","😃","😄","😁","😆","😅","😂","🤣","🥲","🥹","☺️","😊","😇","🙂","🙃","😉","😌","😍","🥰","😘","😗","😙","😚","😋","😛","😝","😜","🤪","🤨","🧐","🤓","😎","🥸","🤩","🥳","😏","😒","😞","😔","😟","😕","🙁","☹️","😣","😖","😫","😩","🥺","😢","😭","😮‍💨","😤","😠","😡","🤬","🤯","😳","🥵","🥶","😱","😨","😰","😥","😓","🫣","🤗","🫡","🤔","🤫","🫠","🤥","😶","😐","😑","😬","🫨","🙄","😯","😦","😧","😮","😲","🥱","😴","🤤","😪","😵","🤐","🥴","🤢","🤮","🤧","😷","🤒","🤕","🤑","🤠","😈","👿","👹","👺","🤡","💩","👻","💀","☠️","👽","👾","🤖","🎃","😺","😸","😹","😻","😼","😽","🙀","😿","😾","👋","🤚","🖐️","✋","🖖","🫱","🫲","🫳","🫴","👌","🤌","🤏","✌️","🤞","🫰","🤟","🤘","🤙","👈","👉","👆","🖕","👇","☝️","🫵","👍","👎","✊","👊","🤛","🤜","👏","🙌","🫶","👐","🤲","🤝","🙏","✍️","💅","🤳","💪","🦾","🦵","🦿","🦶","👂","🦻","👃","🧠","🫀","🫁","💥","✨","🌟","💫","🔥","❤️","💙","🖤","🤍"
        ];

        document.addEventListener("DOMContentLoaded", () => {
            setupAuthTabs();
            loadEmojiPicker();

            // Monitorar Sessão do Usuário
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    document.getElementById('authOverlay').classList.add('hidden');
                    
                    const displayName = user.displayName || user.email.split('@')[0];
                    const photoURL = user.photoURL || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150";

                    document.getElementById('headerName').innerText = displayName;
                    document.getElementById('headerAvatar').src = photoURL;

                    showToast(`Conectado como ${displayName}`);
                    setupRealtimeFirebase();
                } else {
                    currentUser = null;
                    document.getElementById('authOverlay').classList.remove('hidden');
                    if (unsubscribeRealtime) unsubscribeRealtime();
                    document.getElementById('chatBody').innerHTML = '';
                }
            });

            // Handlers dos botões do chat
            document.getElementById('btnSendMessage').onclick = sendMessage;
            document.getElementById('messageInput').onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };
            document.getElementById('btnOpenProfile').onclick = openProfileModal;
            document.getElementById('btnCancelProfile').onclick = () => closeModal('profileModal');
            document.getElementById('btnSaveProfile').onclick = saveProfile;
            document.getElementById('btnOpenWallpaper').onclick = () => openModal('wallpaperModal');
            document.getElementById('btnCloseWallpaper').onclick = () => closeModal('wallpaperModal');
            document.getElementById('btnApplyCustomWp').onclick = applyCustomWallpaper;
            document.getElementById('btnEmojiToggle').onclick = toggleEmojiPicker;
            document.getElementById('btnAttachFile').onclick = () => document.getElementById('fileInput').click();
            document.getElementById('fileInput').onchange = handleFileUpload;
            document.getElementById('btnFullscreen').onclick = toggleFullscreen;
            document.getElementById('btnLogout').onclick = () => signOut(auth);
            document.getElementById('btnCancelEditMsg').onclick = () => closeModal('editMessageModal');
            document.getElementById('btnSaveEditMsg').onclick = saveEditedMessage;

            // Opções de Papéis de Parede
            document.querySelectorAll('.wp-option').forEach(el => {
                el.onclick = () => {
                    const theme = el.getAttribute('data-theme');
                    const chatBody = document.getElementById('chatBody');
                    chatBody.className = 'chat-body ' + theme;
                    chatBody.style.backgroundImage = '';
                    document.querySelectorAll('.wp-option').forEach(o => o.classList.remove('active'));
                    el.classList.add('active');
                    showToast("Papel de parede trocado!");
                };
            });

            // Handlers dos formulários de Login / Cadastro
            document.getElementById('btnLoginSubmit').onclick = handleLogin;
            document.getElementById('btnRegisterSubmit').onclick = handleRegister;
        });

        function setupAuthTabs() {
            const tabLogin = document.getElementById('tabLoginBtn');
            const tabRegister = document.getElementById('tabRegisterBtn');
            const formLogin = document.getElementById('formLogin');
            const formRegister = document.getElementById('formRegister');

            tabLogin.onclick = () => {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
            };

            tabRegister.onclick = () => {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                formRegister.classList.remove('hidden');
                formLogin.classList.add('hidden');
            };
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!email || !password) return showToast("Preencha todos os campos!");

            try {
                showToast("Entrando...");
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                console.error("Erro Login:", err);
                showToast("E-mail ou senha incorretos.");
            }
        }

        async function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const avatar = document.getElementById('regAvatar').value.trim();

            if (!name || !email || !password) return showToast("Preencha Nome, E-mail e Senha!");
            if (password.length < 6) return showToast("A senha deve ter no mínimo 6 caracteres.");

            try {
                showToast("Criando conta...");
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                
                const photo = (avatar && avatar.startsWith('http')) 
                    ? avatar 
                    : "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150";

                await updateProfile(cred.user, {
                    displayName: name,
                    photoURL: photo
                });

                showToast("Conta criada com sucesso!");
            } catch (err) {
                console.error("Erro Cadastro:", err);
                if (err.code === 'auth/operation-not-allowed') {
                    showToast("Ative 'E-mail/Senha' em Authentication no Console do Firebase.");
                } else if (err.code === 'auth/email-already-in-use') {
                    showToast("Este e-mail já está em uso.");
                } else {
                    showToast("Erro ao cadastrar: " + err.message);
                }
            }
        }

        // Sincronização Realtime com tratamento SEGURO de data para evitar quebras
        function setupRealtimeFirebase() {
            if (unsubscribeRealtime) unsubscribeRealtime();

            const messagesRef = collection(db, "mensagens");
            const q = query(messagesRef, orderBy("createdAt", "asc"));

            unsubscribeRealtime = onSnapshot(q, (snapshot) => {
                const chatBody = document.getElementById('chatBody');
                chatBody.innerHTML = '';

                snapshot.forEach(docSnap => {
                    const msg = docSnap.data();
                    const docId = docSnap.id;
                    const isSentByMe = currentUser && msg.autorId === currentUser.uid;

                    const row = document.createElement('div');
                    row.className = `message-row ${isSentByMe ? 'sent' : 'received'}`;

                    let contentHTML = `<div>${msg.texto || ''}</div>`;

                    if (msg.fileUrl) {
                        if (msg.tipo === 'imagem') {
                            contentHTML += `<img src="${msg.fileUrl}" alt="Imagem">`;
                        } else {
                            contentHTML += `<a href="${msg.fileUrl}" target="_blank" download="${msg.fileName || 'arquivo'}" class="file-card"><i class="fa-solid fa-file-arrow-down" style="font-size:20px;"></i> <span>${msg.fileName || 'Baixar Arquivo'}</span></a>`;
                        }
                    }

                    // TRATAMENTO SEGURO DE DATA: Evita erro de .toDate() quando o timestamp ainda está sincronizando
                    let timeStr = 'agora';
                    if (msg.createdAt) {
                        if (typeof msg.createdAt.toDate === 'function') {
                            timeStr = new Date(msg.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        } else if (msg.createdAt.seconds) {
                            timeStr = new Date(msg.createdAt.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        }
                    }

                    const actionsHTML = isSentByMe ? `
                        <div class="message-actions">
                            <i class="fa-solid fa-pen" onclick="window.openEditMsg('${docId}', '${(msg.texto || '').replace(/'/g, "\\'")}')" title="Editar"></i>
                            <i class="fa-solid fa-trash" onclick="window.deleteMsg('${docId}')" title="Excluir" style="color:#ff4d4d;"></i>
                        </div>
                    ` : '';

                    row.innerHTML = `
                        <div class="bubble">
                            ${contentHTML}
                            <div class="meta-info">
                                <span>${timeStr}</span>
                            </div>
                        </div>
                        ${actionsHTML}
                    `;

                    chatBody.appendChild(row);
                });

                chatBody.scrollTop = chatBody.scrollHeight;
            }, (error) => {
                console.error("Erro escuta Firestore:", error);
            });
        }

        // Envio de Texto estritamente compatível com as regras do Firestore
        async function sendMessage() {
            if (!currentUser) return showToast("Faça login para enviar!");
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';

            try {
                const payload = {
                    autorId: currentUser.uid,
                    texto: text,
                    isEncrypted: false,
                    createdAt: serverTimestamp(),
                    tipo: 'texto'
                };

                await addDoc(collection(db, "mensagens"), payload);
            } catch (err) {
                console.error("Erro ao enviar mensagem:", err);
                showToast("Erro ao enviar! Verifique se está autenticado.");
            }
        }

        // Envio de Arquivos / Fotos
        async function handleFileUpload(event) {
            if (!currentUser) return showToast("Faça login primeiro!");
            const file = event.target.files[0];
            if (!file) return;

            showToast("Processando arquivo...");

            if (file.type.startsWith('image/')) {
                compressImage(file, 400, 0.6, async (compressedBase64) => {
                    const payload = {
                        autorId: currentUser.uid,
                        texto: ``,
                        isEncrypted: false,
                        createdAt: serverTimestamp(),
                        tipo: 'imagem',
                        fileUrl: compressedBase64,
                        fileType: file.type,
                        fileName: file.name
                    };

                    try {
                        await addDoc(collection(db, "mensagens"), payload);
                        showToast("Foto enviada!");
                    } catch (err) {
                        console.error("Erro no envio de imagem:", err);
                        showToast("Erro no envio! Verifique as regras do Firestore.");
                    }
                });
            } else {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const payload = {
                        autorId: currentUser.uid,
                        texto: `[Arquivo: ${file.name}]`,
                        isEncrypted: false,
                        createdAt: serverTimestamp(),
                        tipo: 'arquivo',
                        fileUrl: e.target.result,
                        fileType: file.type || 'application/octet-stream',
                        fileName: file.name
                    };

                    try {
                        await addDoc(collection(db, "mensagens"), payload);
                        showToast("Arquivo enviado!");
                    } catch (err) {
                        console.error("Erro no envio de arquivo:", err);
                        showToast("Erro no envio!");
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        // Compactador de imagem para otimizar o banco
        function compressImage(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
            };
        }

        // Editar Mensagem
        window.openEditMsg = function(docId, text) {
            editingMessageDocId = docId;
            document.getElementById('editMessageText').value = text;
            openModal('editMessageModal');
        };

        async function saveEditedMessage() {
            const newText = document.getElementById('editMessageText').value.trim();
            if (!newText || !editingMessageDocId) return;

            try {
                const docRef = doc(db, "mensagens", editingMessageDocId);
                await updateDoc(docRef, { texto: newText });
                closeModal('editMessageModal');
                showToast("Mensagem atualizada!");
            } catch (err) {
                console.error("Erro ao editar:", err);
                showToast("Erro ao editar mensagem.");
            }
        }

        // Excluir Mensagem
        window.deleteMsg = async function(docId) {
            if (!confirm("Deseja apagar esta mensagem?")) return;
            try {
                await deleteDoc(doc(db, "mensagens", docId));
                showToast("Mensagem excluída!");
            } catch (err) {
                console.error("Erro ao excluir:", err);
                showToast("Erro ao excluir mensagem.");
            }
        };

        // Painel de Emojis
        function loadEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.innerHTML = '';
            emojiList.forEach(emoji => {
                const span = document.createElement('span');
                span.innerText = emoji;
                span.onclick = () => { document.getElementById('messageInput').value += emoji; };
                picker.appendChild(span);
            });
        }

        function toggleEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
        }

        // Modais / Fullscreen / Perfil
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function openProfileModal() {
            if (currentUser) {
                document.getElementById('editName').value = currentUser.displayName || '';
                document.getElementById('editAvatar').value = currentUser.photoURL || '';
            }
            openModal('profileModal');
        }

        async function saveProfile() {
            const newName = document.getElementById('editName').value.trim();
            const newAvatar = document.getElementById('editAvatar').value.trim();

            if (currentUser && (newName || newAvatar)) {
                await updateProfile(currentUser, {
                    displayName: newName || currentUser.displayName,
                    photoURL: newAvatar || currentUser.photoURL
                });

                document.getElementById('headerName').innerText = currentUser.displayName;
                document.getElementById('headerAvatar').src = currentUser.photoURL;
                showToast("Perfil atualizado!");
            }
            closeModal('profileModal');
        }

        function applyCustomWallpaper() {
            const url = document.getElementById('customWpUrl').value.trim();
            if (!url) return;
            const chatBody = document.getElementById('chatBody');
            chatBody.className = 'chat-body';
            chatBody.style.backgroundImage = `url('${url}')`;
            closeModal('wallpaperModal');
            showToast("Papel de parede personalizado aplicado!");
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => showToast("Tela cheia indisponível."));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').innerText = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }
    </script>
