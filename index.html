<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Messenger Interativo</title>
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: rgba(22, 30, 46, 0.75);
            --bg-input: rgba(30, 41, 59, 0.8);
            --border-glow: rgba(255, 255, 255, 0.08);
            --primary: #0084ff;
            --primary-gradient: linear-gradient(135deg, #0084ff 0%, #0052d4 100%);
            --sent-bubble: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --received-bubble: linear-gradient(135deg, #0084ff 0%, #0056b3 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030712;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: var(--text-main);
        }

        .mobile-container {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 920px;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            border: 1px solid var(--border-glow);
        }

        @media (max-width: 500px) {
            .mobile-container {
                max-width: 100vw;
                max-height: 100vh;
                border-radius: 0;
                border: none;
            }
        }

        /* TOAST DE NOTIFICAÇÃO */
        .notification-toast {
            position: absolute;
            top: -90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            padding: 12px 16px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2000;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 0.88rem;
            border: 1px solid rgba(0, 132, 255, 0.3);
            width: 90%;
            backdrop-filter: blur(12px);
        }

        .notification-toast.show {
            top: 16px;
        }

        .notification-toast img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }

        .notification-content {
            flex: 1;
            overflow: hidden;
        }

        .notification-content strong {
            display: block;
            font-size: 0.86rem;
            color: #38bdf8;
        }

        .notification-content p {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #cbd5e1;
            font-size: 0.82rem;
            margin-top: 2px;
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            animation: fadeIn 0.25s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.99); }
            to { opacity: 1; transform: scale(1); }
        }

        /* TELA DE AUTENTICAÇÃO */
        .auth-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 28px;
            background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-brand h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #0084ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid var(--border-glow);
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .auth-tab.active {
            color: #ffffff;
            background: var(--primary-gradient);
            box-shadow: 0 4px 12px rgba(0, 132, 255, 0.3);
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 14px;
        }

        .auth-form.active {
            display: flex;
        }

        .auth-input {
            padding: 14px 18px;
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            outline: none;
            font-size: 0.95rem;
            background: var(--bg-input);
            color: #ffffff;
            transition: all 0.2s;
        }

        .auth-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(0, 132, 255, 0.25);
        }

        .auth-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            margin-top: 6px;
            box-shadow: 0 4px 15px rgba(0, 132, 255, 0.35);
            transition: transform 0.1s, opacity 0.2s;
        }

        .auth-btn:active {
            transform: scale(0.98);
        }

        .auth-btn-demo {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glow);
            box-shadow: none;
            color: var(--text-muted);
        }

        .auth-error {
            color: #f87171;
            font-size: 0.82rem;
            text-align: center;
            min-height: 20px;
        }

        /* LISTA DE CONVERSAS */
        .app-header {
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .my-profile-wrapper {
            display: flex;
            align-items: center;
        }

        .my-profile-pic {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 12px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 10px rgba(0, 132, 255, 0.3);
        }

        .my-profile-info h2 {
            font-size: 1.05rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .my-profile-info span {
            font-size: 0.75rem;
            color: #34d399;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .my-profile-info span::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #34d399;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px #34d399;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid var(--border-glow);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.15);
        }

        /* SEARCH BAR */
        .search-container {
            padding: 12px 20px;
            background: rgba(15, 23, 42, 0.4);
            border-bottom: 1px solid var(--border-glow);
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 8px 14px;
            gap: 8px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.88rem;
            width: 100%;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            background: transparent;
        }

        .chat-list-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }

        .chat-list-item:active {
            background: rgba(255, 255, 255, 0.05);
        }

        .avatar-container {
            position: relative;
            margin-right: 14px;
        }

        .chat-list-item img {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-glow);
        }

        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #10b981;
            border: 2px solid var(--bg-main);
            border-radius: 50%;
        }

        .chat-list-details {
            flex: 1;
            overflow: hidden;
        }

        .chat-list-details h4 {
            font-size: 0.98rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .chat-list-details p {
            font-size: 0.84rem;
            color: var(--text-muted);
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: var(--primary);
            color: white;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            display: none;
            box-shadow: 0 0 10px rgba(0, 132, 255, 0.5);
        }

        .chat-list-item.unread .unread-badge {
            display: inline-block;
        }

        /* ÁREA DE CHAT */
        .chat-header {
            padding: 12px 18px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: #38bdf8;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .chat-header img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-glow);
        }

        .chat-header-info h4 {
            font-size: 0.98rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .chat-header-info p {
            font-size: 0.75rem;
            color: #38bdf8;
        }

        /* PAPEL DE PAREDE */
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background-color: #070a12;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 132, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.10) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
        }

        /* BALÕES */
        .message {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .message.received {
            background: var(--received-bubble);
            color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.sent {
            background: var(--sent-bubble);
            color: #f1f5f9;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid var(--border-glow);
        }

        .message img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 12px;
            margin-top: 4px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .audio-player-sim {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 12px;
            border-radius: 12px;
            margin-top: 4px;
            min-width: 180px;
        }

        .audio-play-btn {
            background: var(--primary);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .audio-wave {
            flex: 1;
            height: 16px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .audio-wave span {
            display: inline-block;
            width: 3px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 3px;
        }

        .message-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        .message-time {
            font-size: 0.65rem;
            opacity: 0.75;
        }

        .read-status {
            font-size: 0.72rem;
            color: #38bdf8;
        }

        /* REAÇÃO BADGE */
        .reaction-badge {
            position: absolute;
            bottom: -10px;
            right: 12px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 2px 6px;
            font-size: 0.75rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .reaction-picker {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 6px 12px;
            display: flex;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .reaction-item {
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .reaction-item:hover {
            transform: scale(1.3);
        }

        /* TYPING INDICATOR */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(30, 41, 59, 0.6);
            padding: 8px 14px;
            border-radius: 16px;
            align-self: flex-start;
            width: fit-content;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .typing-dot {
            width: 5px;
            height: 5px;
            background: #38bdf8;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .emoji-picker {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-glow);
            padding: 12px;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            text-align: center;
        }

        .emoji-picker.active {
            display: grid;
        }

        .emoji-item {
            font-size: 1.4rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
        }

        .chat-input-area {
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid var(--border-glow);
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px;
            color: var(--text-muted);
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            outline: none;
            font-size: 0.92rem;
            background: var(--bg-input);
            color: #ffffff;
        }

        .send-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(0,132,255,0.4);
        }

        /* MODAL ADD CONTACT */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #0f172a;
            border: 1px solid var(--border-glow);
            padding: 24px;
            border-radius: 20px;
            width: 88%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal-card h3 {
            font-size: 1.1rem;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- TOAST -->
        <div class="notification-toast" id="notificationToast">
            <img id="toastPic" src="" alt="Avatar">
            <div class="notification-content">
                <strong id="toastName">Nome</strong>
                <p id="toastText">Nova mensagem...</p>
            </div>
        </div>

        <!-- AUTH SCREEN -->
        <div id="authScreen" class="screen active">
            <div class="auth-container">
                <div class="auth-brand">
                    <h1>Chat Messenger</h1>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 6px;">Conecte-se em tempo real com qualquer pessoa</p>
                </div>

                <div class="auth-tabs">
                    <div id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">Entrar</div>
                    <div id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')">Cadastrar</div>
                </div>

                <div id="loginForm" class="auth-form active">
                    <input type="email" id="loginEmail" class="auth-input" placeholder="Seu e-mail">
                    <input type="password" id="loginPassword" class="auth-input" placeholder="Sua senha">
                    <div id="loginError" class="auth-error"></div>
                    <button class="auth-btn" onclick="handleLogin()">Entrar</button>
                    <button class="auth-btn auth-btn-demo" onclick="enterDemoMode('usuario@teste.com', 'Você')">Entrar como Convidado</button>
                </div>

                <div id="registerForm" class="auth-form">
                    <input type="text" id="regName" class="auth-input" placeholder="Seu nome">
                    <input type="email" id="regEmail" class="auth-input" placeholder="Seu e-mail">
                    <input type="password" id="regPassword" class="auth-input" placeholder="Senha">
                    <div id="regError" class="auth-error"></div>
                    <button class="auth-btn" onclick="handleRegister()">Criar Conta</button>
                </div>
            </div>
        </div>

        <!-- CHAT LIST SCREEN -->
        <div id="listScreen" class="screen">
            <div class="app-header">
                <div class="my-profile-wrapper">
                    <img id="userAvatarPic" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" alt="Perfil" class="my-profile-pic">
                    <div class="my-profile-info">
                        <h2 id="userDisplayName">Usuário ✨</h2>
                        <span id="connectionStatus">Online</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" onclick="openAddContactModal()" title="Adicionar amigo / Entrar em Sala">➕</button>
                    <button class="icon-btn" onclick="simulateNewIncomingMessage()" title="Simular Notificação">🔔</button>
                    <button class="icon-btn" onclick="handleLogout()" title="Sair">🚪</button>
                </div>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="searchInput" placeholder="Pesquisar conversa..." oninput="filterChats()">
                </div>
            </div>

            <div class="chat-list" id="chatListContainer">
                <!-- Dinâmico -->
            </div>
        </div>

        <!-- CHAT ROOM SCREEN -->
        <div id="chatScreen" class="screen">
            <div class="chat-header">
                <button class="back-btn" onclick="goBackToList()">❮</button>
                <img id="activeChatPic" src="" alt="Foto">
                <div class="chat-header-info">
                    <h4 id="activeChatName">Nome</h4>
                    <p id="activeChatStatus">Online</p>
                </div>
            </div>

            <div class="chat-messages" id="chatMessagesContainer">
                <!-- Mensagens -->
            </div>

            <div class="emoji-picker" id="emojiPicker">
                <span class="emoji-item" onclick="addEmoji('😀')">😀</span>
                <span class="emoji-item" onclick="addEmoji('😄')">😄</span>
                <span class="emoji-item" onclick="addEmoji('😅')">😅</span>
                <span class="emoji-item" onclick="addEmoji('😂')">😂</span>
                <span class="emoji-item" onclick="addEmoji('🥰')">🥰</span>
                <span class="emoji-item" onclick="addEmoji('😍')">😍</span>
                <span class="emoji-item" onclick="addEmoji('😎')">😎</span>
                <span class="emoji-item" onclick="addEmoji('🥳')">🥳</span>
                <span class="emoji-item" onclick="addEmoji('❤️')">❤️</span>
                <span class="emoji-item" onclick="addEmoji('🔥')">🔥</span>
                <span class="emoji-item" onclick="addEmoji('✨')">✨</span>
                <span class="emoji-item" onclick="addEmoji('👍')">👍</span>
                <span class="emoji-item" onclick="addEmoji('🚀')">🚀</span>
            </div>

            <div class="chat-input-area">
                <button class="action-btn" onclick="toggleEmojiPicker()">😊</button>
                
                <label for="fileInput" class="action-btn">📎</label>
                <input type="file" id="fileInput" style="display: none;" onchange="sendFile(event)">

                <button class="action-btn" onclick="sendSimulatedVoiceNote()">🎙️</button>
                
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

    </div>

    <!-- MODAL PARA ADICIONAR CONTATO / ENTRAR EM SALA -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-card">
            <h3>Iniciar Nova Conversa</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted);">Digite o nome, e-mail da pessoa ou um código de sala (ex: <strong>sala123</strong>) para conversarem no mesmo chat:</p>
            <input type="text" id="newChatInput" class="auth-input" placeholder="Ex: Lucas ou sala123">
            <button class="auth-btn" onclick="addNewContactOrRoom()">Entrar / Conversar</button>
            <button class="auth-btn auth-btn-demo" onclick="closeAddContactModal()">Cancelar</button>
        </div>
    </div>

    <!-- MENU REAÇÕES -->
    <div class="reaction-picker" id="reactionPicker" style="display: none;">
        <span class="reaction-item" onclick="reactToMessage('❤️')">❤️</span>
        <span class="reaction-item" onclick="reactToMessage('👍')">👍</span>
        <span class="reaction-item" onclick="reactToMessage('😂')">😂</span>
        <span class="reaction-item" onclick="reactToMessage('🔥')">🔥</span>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyDQ3ebWx62hta35KRdihRbtwJoxrlUtxiM",
          authDomain: "chat-e797a.firebaseapp.com",
          projectId: "chat-e797a",
          storageBucket: "chat-e797a.firebasestorage.app",
          messagingSenderId: "104946241159",
          appId: "1:104946241159:web:93acbec71b40ec46c87222"
        };

        let auth = null;
        let db = null;

        try {
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();
            }
        } catch(e) {
            console.warn("Fallback local ativado.", e);
        }

        let currentUser = null;
        let unsubscribeMessages = null;
        let selectedMessageIndex = null;

        // Base de Dados Inicial
        let chatsData = [
            {
                id: "ai_bot",
                name: "Assistente IA ✨",
                pic: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&h=100&fit=crop&crop=faces",
                status: "Sempre online para conversar",
                isBot: true,
                unread: false,
                messages: [
                    { id: 'b1', autorId: "bot", sender: "received", text: "Olá! Sou seu assistente de teste! Pode me mandar qualquer mensagem que respondo na hora. 🚀", time: "10:00", createdAt: 1 }
                ]
            },
            {
                id: "sala_publica",
                name: "Grupo Público Global 🌎",
                pic: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=100&h=100&fit=crop&crop=faces",
                status: "Todos podem conversar aqui",
                unread: false,
                messages: [
                    { id: 'g1', autorId: "system", sender: "received", text: "Bem-vindo ao canal público! Digite algo para interagir.", time: "10:01", createdAt: 1 }
                ]
            }
        ];

        let currentChatId = "ai_bot";

        if (auth) {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                    showScreen('listScreen');
                    document.getElementById('userDisplayName').innerText = (user.displayName || user.email.split('@')[0]) + " ✨";
                    renderChatList();
                } else if (!currentUser) {
                    showScreen('authScreen');
                }
            });
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('loginForm').classList.add('active');
                document.getElementById('registerForm').classList.remove('active');
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabRegister').classList.remove('active');
            } else {
                document.getElementById('registerForm').classList.add('active');
                document.getElementById('loginForm').classList.remove('active');
                document.getElementById('tabRegister').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
            }
        }

        function enterDemoMode(email, name) {
            currentUser = {
                uid: 'usr_' + Date.now(),
                displayName: name || 'Você',
                email: email || 'demo@chat.com'
            };
            showScreen('listScreen');
            document.getElementById('userDisplayName').innerText = currentUser.displayName + " ✨";
            renderChatList();
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!email || !password) return;

            if (auth) {
                auth.signInWithEmailAndPassword(email, password).catch(e => {
                    document.getElementById('loginError').innerText = e.message;
                });
            } else {
                enterDemoMode(email);
            }
        }

        function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            if (!name || !email || !password) return;

            if (auth) {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(r => r.user.updateProfile({ displayName: name }))
                    .catch(e => document.getElementById('regError').innerText = e.message);
            } else {
                enterDemoMode(email, name);
            }
        }

        function handleLogout() {
            if (auth) auth.signOut();
            currentUser = null;
            showScreen('authScreen');
        }

        function openAddContactModal() {
            document.getElementById('addModal').classList.add('active');
        }

        function closeAddContactModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('newChatInput').value = '';
        }

        function addNewContactOrRoom() {
            const val = document.getElementById('newChatInput').value.trim();
            if (!val) return;

            const chatRoomId = val.toLowerCase().replace(/\s+/g, '_');
            
            let existing = chatsData.find(c => c.id === chatRoomId);
            if (!existing) {
                existing = {
                    id: chatRoomId,
                    name: val,
                    pic: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop&crop=faces",
                    status: "Sala/Contato " + val,
                    unread: false,
                    messages: [
                        { id: 'init_1', autorId: 'system', sender: 'received', text: `Conversa criada para "${val}". Compartilhe esse nome para conversarem aqui!`, time: 'Agora', createdAt: Date.now() }
                    ]
                };
                chatsData.unshift(existing);
            }

            closeAddContactModal();
            renderChatList();
            openChat(existing.id);
        }

        function renderChatList(filterTerm = '') {
            const container = document.getElementById('chatListContainer');
            container.innerHTML = '';

            const filtered = chatsData.filter(c => c.name.toLowerCase().includes(filterTerm.toLowerCase()));

            filtered.forEach(chat => {
                const lastMsg = chat.messages[chat.messages.length - 1];
                let lastText = lastMsg ? (lastMsg.text || 'Anexo / Mídia') : 'Sem mensagens';

                const item = document.createElement('div');
                item.className = `chat-list-item ${chat.unread ? 'unread' : ''}`;
                item.onclick = () => openChat(chat.id);
                item.innerHTML = `
                    <div class="avatar-container">
                        <img src="${chat.pic}" alt="${chat.name}">
                        <div class="online-dot"></div>
                    </div>
                    <div class="chat-list-details">
                        <h4>${chat.name}</h4>
                        <p>${lastText}</p>
                    </div>
                    <span class="unread-badge">1</span>
                `;
                container.appendChild(item);
            });
        }

        function filterChats() {
            renderChatList(document.getElementById('searchInput').value);
        }

        function openChat(id) {
            currentChatId = String(id);
            const chat = chatsData.find(c => String(c.id) === currentChatId);
            if (chat) chat.unread = false;

            showScreen('chatScreen');
            document.getElementById('emojiPicker').classList.remove('active');

            if (unsubscribeMessages) {
                unsubscribeMessages();
                unsubscribeMessages = null;
            }

            // Sincronização em tempo real Firestore por sala
            if (db) {
                try {
                    unsubscribeMessages = db.collection("mensagens")
                        .where("chatId", "==", currentChatId)
                        .onSnapshot(snapshot => {
                            if (snapshot && !snapshot.empty) {
                                const loaded = [];
                                snapshot.forEach(doc => {
                                    const data = doc.data();
                                    const myUid = currentUser ? currentUser.uid : 'anon';
                                    loaded.push({
                                        id: doc.id,
                                        autorId: data.autorId,
                                        sender: data.autorId === myUid ? 'sent' : 'received',
                                        text: data.text || '',
                                        isAudio: data.isAudio || false,
                                        fileUrl: data.fileUrl || null,
                                        time: data.time || '10:00',
                                        createdAt: data.createdAt ? (data.createdAt.toMillis ? data.createdAt.toMillis() : Date.now()) : Date.now()
                                    });
                                });
                                loaded.sort((a, b) => a.createdAt - b.createdAt);
                                if (chat) chat.messages = loaded;
                            }
                            renderActiveChat();
                        }, () => renderActiveChat());
                } catch(e) { renderActiveChat(); }
            } else {
                renderActiveChat();
            }

            renderActiveChat();
        }

        function goBackToList() {
            if (unsubscribeMessages) {
                unsubscribeMessages();
                unsubscribeMessages = null;
            }
            showScreen('listScreen');
            renderChatList();
        }

        function renderActiveChat() {
            const chat = chatsData.find(c => String(c.id) === currentChatId);
            if (!chat) return;

            document.getElementById('activeChatName').innerText = chat.name;
            document.getElementById('activeChatPic').src = chat.pic;
            document.getElementById('activeChatStatus').innerText = chat.status;

            const container = document.getElementById('chatMessagesContainer');
            container.innerHTML = '';

            chat.messages.forEach((msg, index) => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.sender}`;
                msgDiv.onclick = (e) => showReactionMenu(e, index);

                let content = '';

                if (msg.isAudio) {
                    content += `<div class="audio-player-sim"><button class="audio-play-btn" onclick="event.stopPropagation(); playAudioSim(this)">▶</button><div class="audio-wave"><span></span><span></span><span></span><span></span></div><span style="font-size:0.7rem;">0:05</span></div>`;
                } else if (msg.fileUrl) {
                    content += `<img src="${msg.fileUrl}">`;
                }

                if (msg.text) content += `<span>${msg.text}</span>`;
                if (msg.reaction) content += `<div class="reaction-badge">${msg.reaction}</div>`;

                content += `<div class="message-footer"><span class="message-time">${msg.time}</span>${msg.sender === 'sent' ? `<span class="read-status">✓✓</span>` : ''}</div>`;

                msgDiv.innerHTML = content;
                container.appendChild(msgDiv);
            });

            container.scrollTop = container.scrollHeight;
        }

        function showReactionMenu(e, index) {
            e.stopPropagation();
            selectedMessageIndex = index;
            const picker = document.getElementById('reactionPicker');
            picker.style.display = 'flex';
            picker.style.top = (e.clientY - 40) + 'px';
            picker.style.left = Math.min(e.clientX, window.innerWidth - 180) + 'px';
        }

        function reactToMessage(emoji) {
            const chat = chatsData.find(c => String(c.id) === currentChatId);
            if (chat && selectedMessageIndex !== null) {
                chat.messages[selectedMessageIndex].reaction = emoji;
                renderActiveChat();
            }
            document.getElementById('reactionPicker').style.display = 'none';
        }

        document.addEventListener('click', () => {
            document.getElementById('reactionPicker').style.display = 'none';
        });

        function toggleEmojiPicker() {
            document.getElementById('emojiPicker').classList.toggle('active');
        }

        function addEmoji(emoji) {
            const input = document.getElementById('messageInput');
            input.value += emoji;
            input.focus();
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const myUid = currentUser ? currentUser.uid : 'anon';
            const chat = chatsData.find(c => String(c.id) === currentChatId);

            const newMsg = {
                id: 'loc_' + Date.now(),
                autorId: myUid,
                sender: 'sent',
                text: text,
                time: timeStr,
                createdAt: Date.now()
            };

            if (chat) chat.messages.push(newMsg);
            renderActiveChat();
            input.value = '';
            document.getElementById('emojiPicker').classList.remove('active');

            if (db) {
                db.collection("mensagens").add({
                    chatId: currentChatId,
                    autorId: myUid,
                    text: text,
                    time: timeStr,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(() => {});
            }

            // Se for conversa com o BOT IA, ele responde automaticamente
            if (chat && chat.isBot) {
                simulateBotResponse(text);
            }
        }

        function simulateBotResponse(userMsg) {
            const container = document.getElementById('chatMessagesContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `Assistente digitando <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>`;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;

            setTimeout(() => {
                const el = document.getElementById('typingIndicator');
                if (el) el.remove();

                let botReply = "Que legal! Como posso te ajudar com o aplicativo hoje?";
                const lower = userMsg.toLowerCase();

                if (lower.includes('oi') || lower.includes('olá')) botReply = "Olá! Tudo bem com você? 😊";
                else if (lower.includes('tudo')) botReply = "Tudo ótimo por aqui também! ✨";
                else if (lower.includes('teste')) botReply = "O teste do chat em tempo real está funcionando perfeitamente!";
                else if (lower.includes('ajuda')) botReply = "Você pode usar o botão + lá na lista para criar uma nova sala com amigos!";

                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const chat = chatsData.find(c => c.id === 'ai_bot');
                if (chat) {
                    chat.messages.push({
                        id: 'bot_' + Date.now(),
                        autorId: 'bot',
                        sender: 'received',
                        text: botReply,
                        time: timeStr,
                        createdAt: Date.now()
                    });
                    renderActiveChat();
                }
            }, 1200);
        }

        function sendSimulatedVoiceNote() {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const chat = chatsData.find(c => String(c.id) === currentChatId);

            if (chat) {
                chat.messages.push({
                    id: 'loc_' + Date.now(),
                    autorId: currentUser ? currentUser.uid : 'anon',
                    sender: 'sent',
                    isAudio: true,
                    time: timeStr,
                    createdAt: Date.now()
                });
                renderActiveChat();
            }
        }

        function playAudioSim(btn) {
            btn.innerText = '⏸';
            setTimeout(() => { btn.innerText = '▶'; }, 3000);
        }

        function sendFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const chat = chatsData.find(c => String(c.id) === currentChatId);
                if (chat) {
                    chat.messages.push({
                        id: 'loc_' + Date.now(),
                        autorId: currentUser ? currentUser.uid : 'anon',
                        sender: 'sent',
                        fileUrl: evt.target.result,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        createdAt: Date.now()
                    });
                    renderActiveChat();
                }
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function showNotificationAlert(name, pic, text) {
            const toast = document.getElementById('notificationToast');
            document.getElementById('toastName').innerText = name;
            document.getElementById('toastPic').src = pic;
            document.getElementById('toastText').innerText = text;
            
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function simulateNewIncomingMessage() {
            showNotificationAlert("Família Oliveira", "https://images.unsplash.com/photo-1511895426328-dc8714191300?w=100&h=100&fit=crop&crop=faces", "Chegou mensagem nova no grupo!");
        }
    </script>
</body>
</html>
