<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Chat Premium Real-Time com Gerenciador de Contatos</title>
    <style>
        :root {
            --bg-gradient-1: linear-gradient(135deg, #121214 0%, #1a1a1e 100%);
            --bg-gradient-2: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --bg-gradient-3: linear-gradient(135deg, #141e30 0%, #243b55 100%);
            --bg-gradient-4: linear-gradient(135deg, #000000 0%, #434343 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0b0b0d;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: var(--bg-gradient-1);
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: background 0.5s ease;
            position: relative;
        }

        /* Tela de Autenticação */
        .auth-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #121214;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .auth-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .auth-box h2 {
            color: #fff;
            font-size: 20px;
            text-align: center;
        }

        .auth-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .auth-btn {
            background: #ffffff;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-toggle-text {
            color: #b0b0b5;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Cabeçalho do Chat */
        .chat-header {
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #007bff;
            cursor: pointer;
        }

        #file-avatar { display: none; }

        .profile-detail h4 {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .logout-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notif-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #ffc107;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .wallpaper-select {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 8px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }
        .wallpaper-select option { background: #1a1a1e; color: #fff; }

        /* Barra de Seleção de Conversa e Botões de Ação */
        .chat-selector-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .room-select {
            flex: 1;
            background: #1a1a1e;
            color: #00ff88;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .action-bar-btn {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .action-bar-btn:hover { background: rgba(255,255,255,0.2); }
        .action-bar-btn.blue { background: #007bff; border-color: #007bff; }
        .action-bar-btn.blue:hover { background: #0056b3; }

        /* Feed de Mensagens */
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
            color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .message.left {
            background-color: #007bff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.right {
            background-color: #000000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .msg-author {
            font-size: 10px;
            color: rgba(255,255,255,0.7);
            font-weight: 700;
            margin-bottom: 2px;
        }

        .msg-time {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.6);
            align-self: flex-end;
            margin-top: 4px;
        }

        .delete-btn {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .message:hover .delete-btn { display: flex; }

        .message img, .message video {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 4px;
            display: block;
        }

        .file-link {
            color: #00ff88;
            text-decoration: none;
            font-weight: 600;
        }

        .file-caption {
            margin-top: 4px;
            font-size: 13px;
            color: #eeeeee;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 4px;
        }

        .encrypted-badge {
            font-size: 11px;
            color: #ffc107;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Entrada de Texto */
        .chat-input-area {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tools-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            padding-left: 4px;
        }

        .tool-btn {
            background: none;
            border: none;
            color: #b0b0b5;
            font-size: 18px;
            cursor: pointer;
        }

        .encrypt-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #b0b0b5;
            font-size: 11px;
            cursor: pointer;
            margin-left: auto;
        }

        .input-row { display: flex; gap: 8px; align-items: center; }

        #msg-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 14px;
            border-radius: 14px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        #send-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 16px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Emojis */
        .emoji-picker {
            display: none;
            position: absolute;
            bottom: 110px;
            left: 16px;
            right: 16px;
            background: #1a1a1e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            z-index: 20;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .emoji-picker span { font-size: 20px; cursor: pointer; text-align: center; padding: 4px; border-radius: 6px; }
        .emoji-picker span:hover { background: rgba(255,255,255,0.1); }

        /* Modais */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 12, 0.95);
            z-index: 40;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: #1a1a1e;
            width: 100%;
            border-radius: 16px;
            padding: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 85vh;
        }

        .modal-box h3 { color: white; font-size: 16px; }

        .preview-container {
            width: 100%; max-height: 180px; overflow: hidden; border-radius: 10px;
            display: flex; justify-content: center; align-items: center; background: #000;
        }
        .preview-container img, .preview-container video { max-width: 100%; max-height: 180px; object-fit: contain; }

        .modal-input {
            width: 100%; background: #25252b; border: 1px solid #3a3a42;
            padding: 10px; color: white; border-radius: 8px; outline: none; font-size: 13px;
        }

        /* Lista de Contatos com Estilo Card */
        .contacts-list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            background: #121214;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .contact-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .contact-card-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contact-card-avatar {
            width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
            border: 1px solid #007bff;
        }

        .contact-card-details h5 { color: #fff; font-size: 13px; }
        .contact-card-details p { color: #888; font-size: 10.5px; }

        .contact-start-btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .users-checkbox-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
            background: #25252b;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #3a3a42;
        }

        .user-checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
        }
        .user-checkbox-item input { cursor: pointer; }
    </style>
</head>
<body>

    <div class="chat-container" id="chat-box">
        
        <!-- Tela de Autenticação -->
        <div class="auth-overlay" id="auth-overlay">
            <div class="auth-box">
                <h2 id="auth-title">Acessar o Chat</h2>
                <input type="email" id="auth-email" class="auth-input" placeholder="Seu e-mail">
                <input type="password" id="auth-password" class="auth-input" placeholder="Sua senha">
                <button id="auth-primary-btn" class="auth-btn">Entrar</button>
                <p id="auth-toggle-link" class="auth-toggle-text">Não tem uma conta? Cadastre-se</p>
            </div>
        </div>

        <!-- Cabeçalho -->
        <div class="chat-header">
            <div class="header-top">
                <div class="profile-info">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop" alt="Avatar" class="profile-img" id="avatar-preview">
                    <input type="file" id="file-avatar" accept="image/*">
                    <div class="profile-detail">
                        <h4 id="profile-name">Carregando...</h4>
                        <button class="logout-btn" id="logout-btn">Sair</button>
                    </div>
                </div>
                
                <div class="header-actions">
                    <button class="notif-btn" id="enable-notif-btn" title="Ativar Notificações">🔔</button>
                    <select class="wallpaper-select" id="wallpaper-selector">
                        <option value="1">Noir</option>
                        <option value="2">Ocean</option>
                        <option value="3">Blue</option>
                        <option value="4">Carbon</option>
                    </select>
                </div>
            </div>

            <!-- Seletor de Chat e Botões de Gerenciamento -->
            <div class="chat-selector-bar">
                <select class="room-select" id="chat-room-select">
                    <option value="global">🌐 Grupo Geral (Todos)</option>
                </select>
                <button class="action-bar-btn" id="open-contacts-btn">📇 Contatos</button>
                <button class="action-bar-btn blue" id="open-group-modal-btn">➕ Grupo</button>
            </div>
        </div>

        <!-- Feed de Mensagens -->
        <div class="chat-messages" id="chat-messages"></div>

        <!-- Emojis -->
        <div class="emoji-picker" id="emoji-picker"></div>

        <!-- Modal de Mídia -->
        <div class="modal-overlay" id="file-modal">
            <div class="modal-box">
                <h3 id="upload-status-title">Enviar Foto / Arquivo</h3>
                <div class="preview-container" id="file-preview-zone"></div>
                <input type="text" id="file-caption-input" class="modal-input" placeholder="Escreva uma legenda...">
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button id="cancel-file-btn" style="background: none; border: none; color: #ff4d4d; cursor: pointer; font-weight: 600;">Cancelar</button>
                    <button id="confirm-file-btn" style="background: #fff; border: none; color: #000; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;">Enviar Rápido</button>
                </div>
            </div>
        </div>

        <!-- Modal de Gerenciador de Contatos -->
        <div class="modal-overlay" id="contacts-modal">
            <div class="modal-box">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3>📇 Meus Contatos</h3>
                    <button id="close-contacts-btn" style="background:none; border:none; color:#ff4d4d; font-size:18px; cursor:pointer;">✕</button>
                </div>
                <input type="text" id="search-contact-input" class="modal-input" placeholder="🔍 Buscar contato por nome...">
                <div class="contacts-list-container" id="contacts-full-list"></div>
            </div>
        </div>

        <!-- Modal de Criar Novo Grupo -->
        <div class="modal-overlay" id="group-modal">
            <div class="modal-box">
                <h3>👥 Criar Novo Grupo</h3>
                <input type="text" id="group-name-input" class="modal-input" placeholder="Nome do Grupo (ex: Família, Trabalho...)">
                <p style="color:#b0b0b5; font-size:12px;">Selecione os contatos membros do grupo:</p>
                <div class="users-checkbox-list" id="group-users-list"></div>
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button id="cancel-group-btn" style="background: none; border: none; color: #ff4d4d; cursor: pointer; font-weight: 600;">Cancelar</button>
                    <button id="confirm-group-btn" style="background: #007bff; border: none; color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;">Criar Grupo</button>
                </div>
            </div>
        </div>

        <!-- Área de Entrada -->
        <div class="chat-input-area">
            <div class="tools-bar">
                <button class="tool-btn" id="emoji-toggle-btn">😀</button>
                <button class="tool-btn" id="attach-btn">📎</button>
                <input type="file" id="file-input" accept="image/*,video/*,application/*" style="display: none;">

                <label class="encrypt-toggle">
                    <input type="checkbox" id="encrypt-check"> 🔑 Criptografar
                </label>
            </div>

            <div class="input-row">
                <input type="text" id="msg-input" placeholder="Digite uma mensagem..." onkeypress="checkEnter(event)">
                <button id="send-btn">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQ3ebWx62hta35KRdihRbtwJoxrlUtxiM",
            authDomain: "chat-e797a.firebaseapp.com",
            projectId: "chat-e797a",
            storageBucket: "chat-e797a.firebasestorage.app",
            messagingSenderId: "104946241159",
            appId: "1:104946241159:web:93acbec71b40ec46c87222"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let usuarioAtual = null;
        let isScreenLoginMode = true;
        let audioCtxInstance = null;
        let currentChatId = "global"; 
        let usuariosCadastrados = [];

        const authOverlay = document.getElementById('auth-overlay');
        const authTitle = document.getElementById('auth-title');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');
        const authPrimaryBtn = document.getElementById('auth-primary-btn');
        const authToggleLink = document.getElementById('auth-toggle-link');
        
        const chatMessages = document.getElementById('chat-messages');
        const msgInput = document.getElementById('msg-input');
        const encryptCheck = document.getElementById('encrypt-check');
        const emojiPicker = document.getElementById('emoji-picker');
        const fileInput = document.getElementById('file-input');
        
        const fileModal = document.getElementById('file-modal');
        const groupModal = document.getElementById('group-modal');
        const contactsModal = document.getElementById('contacts-modal');

        const filePreviewZone = document.getElementById('file-preview-zone');
        const fileCaptionInput = document.getElementById('file-caption-input');
        const enableNotifBtn = document.getElementById('enable-notif-btn');
        const chatRoomSelect = document.getElementById('chat-room-select');

        let rawSelectedFile = null;
        let unsubscribeSnapshot = null;

        // Áudio
        window.addEventListener('click', () => {
            if (!audioCtxInstance) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) audioCtxInstance = new AudioCtx();
            }
        }, { once: false });

        function tocarSom(tipo = 'recebida') {
            try {
                if (!audioCtxInstance) return;
                const osc = audioCtxInstance.createOscillator();
                const gain = audioCtxInstance.createGain();
                osc.connect(gain);
                gain.connect(audioCtxInstance.destination);

                if (tipo === 'enviada') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, audioCtxInstance.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtxInstance.currentTime);
                    osc.start();
                    osc.stop(audioCtxInstance.currentTime + 0.08);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, audioCtxInstance.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtxInstance.currentTime);
                    osc.start();
                    osc.stop(audioCtxInstance.currentTime + 0.15);
                }
            } catch(e) {}
        }

        // Criptografia por Senha
        function criptografar(texto, senha) {
            let res = '';
            for (let i = 0; i < texto.length; i++) {
                res += String.fromCharCode(texto.charCodeAt(i) ^ senha.charCodeAt(i % senha.length));
            }
            return JSON.stringify({ data: btoa(unescape(encodeURIComponent(res))), passHash: btoa(senha) });
        }

        function decriptografar(payloadStr, senhaDigitada) {
            try {
                const obj = JSON.parse(payloadStr);
                if (obj.passHash !== btoa(senhaDigitada)) return null;
                const raw = decodeURIComponent(escape(atob(obj.data)));
                let res = '';
                for (let i = 0; i < raw.length; i++) {
                    res += String.fromCharCode(raw.charCodeAt(i) ^ senhaDigitada.charCodeAt(i % senhaDigitada.length));
                }
                return res;
            } catch (e) { return null; }
        }

        function obterHora(createdAt) {
            if (!createdAt) return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const data = createdAt.toDate ? createdAt.toDate() : new Date(createdAt);
            return data.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Autenticação
        authToggleLink.onclick = () => {
            isScreenLoginMode = !isScreenLoginMode;
            authTitle.innerText = isScreenLoginMode ? "Acessar o Chat" : "Criar Nova Conta";
            authPrimaryBtn.innerText = isScreenLoginMode ? "Entrar" : "Cadastrar";
            authToggleLink.innerText = isScreenLoginMode ? "Não tem uma conta? Cadastre-se" : "Já possui conta? Entre aqui";
        };

        authPrimaryBtn.onclick = () => {
            const email = authEmail.value.trim();
            const password = authPassword.value;
            if (!email || !password) return alert("Preencha todos os campos!");

            if (isScreenLoginMode) {
                signInWithEmailAndPassword(auth, email, password).catch(e => alert("Erro: " + e.message));
            } else {
                createUserWithEmailAndPassword(auth, email, password).then((cred) => {
                    salvarPerfilUsuario(cred.user);
                    alert("Conta criada! Faça seu login.");
                    authToggleLink.click();
                }).catch(e => alert("Erro: " + e.message));
            }
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioAtual = user;
                authOverlay.style.display = 'none';
                
                const nomeSalvo = localStorage.getItem('profile_name_' + user.uid) || user.email.split('@')[0];
                document.getElementById('profile-name').innerText = nomeSalvo;
                
                const avatarSalvo = localStorage.getItem('profile_avatar_' + user.uid);
                if(avatarSalvo) document.getElementById('avatar-preview').src = avatarSalvo;

                salvarPerfilUsuario(user);
                escutarUsuariosEGrupos();
                iniciarEscutaMensagens();
            } else {
                usuarioAtual = null;
                authOverlay.style.display = 'flex';
            }
        });

        function salvarPerfilUsuario(user) {
            if (!user) return;
            const nome = localStorage.getItem('profile_name_' + user.uid) || user.email.split('@')[0];
            const avatar = localStorage.getItem('profile_avatar_' + user.uid) || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop';
            setDoc(doc(db, "usuarios", user.uid), {
                uid: user.uid,
                nome: nome,
                email: user.email,
                avatar: avatar,
                ultimoAcesso: serverTimestamp()
            }, { merge: true });
        }

        // Carregar Lista de Contatos e Grupos
        function escutarUsuariosEGrupos() {
            onSnapshot(collection(db, "usuarios"), (snapshotUsers) => {
                usuariosCadastrados = [];
                snapshotUsers.forEach(d => {
                    const u = d.data();
                    if (u.uid !== usuarioAtual.uid) usuariosCadastrados.push(u);
                });

                onSnapshot(collection(db, "grupos"), (snapshotGroups) => {
                    const selVal = chatRoomSelect.value;
                    chatRoomSelect.innerHTML = '<option value="global">🌐 Grupo Geral (Todos)</option>';

                    snapshotGroups.forEach(d => {
                        const g = d.data();
                        if (g.membros && g.membros.includes(usuarioAtual.uid)) {
                            const opt = document.createElement('option');
                            opt.value = "group_" + d.id;
                            opt.textContent = `👥 Grupo: ${g.nome}`;
                            chatRoomSelect.appendChild(opt);
                        }
                    });

                    usuariosCadastrados.forEach(u => {
                        const opt = document.createElement('option');
                        const privateId = [usuarioAtual.uid, u.uid].sort().join('_');
                        opt.value = privateId;
                        opt.textContent = `💬 ${u.nome || u.email.split('@')[0]} (Particular)`;
                        chatRoomSelect.appendChild(opt);
                    });

                    chatRoomSelect.value = selVal;
                });
            });
        }

        chatRoomSelect.onchange = (e) => {
            currentChatId = e.target.value;
            iniciarEscutaMensagens();
        };

        // Modal de Contatos
        document.getElementById('open-contacts-btn').onclick = () => {
            renderizarListaContatos(usuariosCadastrados);
            contactsModal.style.display = 'flex';
        };

        document.getElementById('close-contacts-btn').onclick = () => contactsModal.style.display = 'none';

        document.getElementById('search-contact-input').oninput = (e) => {
            const termo = e.target.value.toLowerCase();
            const filtrados = usuariosCadastrados.filter(u => 
                (u.nome && u.nome.toLowerCase().includes(termo)) || 
                (u.email && u.email.toLowerCase().includes(termo))
            );
            renderizarListaContatos(filtrados);
        };

        function renderizarListaContatos(lista) {
            const container = document.getElementById('contacts-full-list');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<p style="color:#888; font-size:12px; text-align:center; padding:10px;">Nenhum contato encontrado.</p>';
                return;
            }

            lista.forEach(u => {
                const card = document.createElement('div');
                card.className = 'contact-card';

                const privateId = [usuarioAtual.uid, u.uid].sort().join('_');
                const avatar = u.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop';

                card.innerHTML = `
                    <div class="contact-card-info">
                        <img src="${avatar}" class="contact-card-avatar">
                        <div class="contact-card-details">
                            <h5>${u.nome || u.email.split('@')[0]}</h5>
                            <p>${u.email}</p>
                        </div>
                    </div>
                `;

                const btn = document.createElement('button');
                btn.className = 'contact-start-btn';
                btn.innerText = '💬 Conversar';
                btn.onclick = () => {
                    currentChatId = privateId;
                    chatRoomSelect.value = privateId;
                    contactsModal.style.display = 'none';
                    iniciarEscutaMensagens();
                };

                card.appendChild(btn);
                container.appendChild(card);
            });
        }

        // Modal de Criar Grupo
        document.getElementById('open-group-modal-btn').onclick = () => {
            const listDiv = document.getElementById('group-users-list');
            listDiv.innerHTML = '';

            if (usuariosCadastrados.length === 0) {
                listDiv.innerHTML = '<p style="color:#888; font-size:12px;">Nenhum outro contato para adicionar.</p>';
            } else {
                usuariosCadastrados.forEach(u => {
                    const label = document.createElement('label');
                    label.className = 'user-checkbox-item';
                    label.innerHTML = `
                        <input type="checkbox" value="${u.uid}" class="group-user-cb">
                        <span>${u.nome || u.email}</span>
                    `;
                    listDiv.appendChild(label);
                });
            }

            document.getElementById('group-name-input').value = '';
            groupModal.style.display = 'flex';
        };

        document.getElementById('cancel-group-btn').onclick = () => groupModal.style.display = 'none';

        document.getElementById('confirm-group-btn').onclick = () => {
            const nomeGrupo = document.getElementById('group-name-input').value.trim();
            if (!nomeGrupo) return alert("Digite o nome do grupo!");

            const cbs = document.querySelectorAll('.group-user-cb:checked');
            const membrosSelecionados = [usuarioAtual.uid];
            cbs.forEach(cb => membrosSelecionados.push(cb.value));

            addDoc(collection(db, "grupos"), {
                nome: nomeGrupo,
                criadorId: usuarioAtual.uid,
                membros: membrosSelecionados,
                createdAt: serverTimestamp()
            }).then(() => {
                alert(`Grupo "${nomeGrupo}" criado com sucesso!`);
                groupModal.style.display = 'none';
            });
        };

        // Emojis
        const emojis = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😋','😛','😜','🤪','🤨','🧐','🤓','😎','🤩','🥳','😏','😒','😞','😔','😟','😕','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','🥱','😴','🤤','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕','🤑','🤠','😈','👹','👺','🤡','💩','👻','💀','👽','🤖','🎃','😺','😸','😹','😻','😼','😽','👋','🤚','🖐️','✋','🖖','👌','🤏','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','🖕','👇','☝️','👍','👎','✊','👊','🤛','🤜','👏','🙌','👐','🤲','🤝','🙏','✍️','💅','🤳','💪','🦾','❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝','⚽','🏀','🏈','⚾','🎾','🏐','🏉','🎱','🏓','🏸','⛳','🏹','🎣','🥊','🥋','🚗','🚕','🚙','🚌','🚓','🚑','🚒','🚀','✈️','🛸','🔥','⭐','✨','⚡','💥','🎉','🎊','🎈','🎁','🇧🇷','🇺🇸'];

        emojis.forEach(e => {
            const s = document.createElement('span');
            s.innerText = e;
            s.onclick = () => { msgInput.value += e; msgInput.focus(); };
            emojiPicker.appendChild(s);
        });

        document.getElementById('emoji-toggle-btn').onclick = () => emojiPicker.style.display = emojiPicker.style.display === 'grid' ? 'none' : 'grid';
        document.getElementById('attach-btn').onclick = () => fileInput.click();
        document.getElementById('cancel-file-btn').onclick = () => { fileModal.style.display = 'none'; rawSelectedFile = null; };
        document.getElementById('wallpaper-selector').onchange = (e) => document.getElementById('chat-box').style.background = `var(--bg-gradient-${e.target.value})`;
        
        document.getElementById('avatar-preview').onclick = () => document.getElementById('file-avatar').click();
        document.getElementById('file-avatar').onchange = (e) => {
            const f = e.target.files[0];
            if(f) {
                const r = new FileReader();
                r.onload = (ev) => {
                    document.getElementById('avatar-preview').src = ev.target.result;
                    if(usuarioAtual) {
                        localStorage.setItem('profile_avatar_' + usuarioAtual.uid, ev.target.result);
                        salvarPerfilUsuario(usuarioAtual);
                    }
                };
                r.readAsDataURL(f);
            }
        };

        document.getElementById('profile-name').onclick = () => {
            const n = prompt("Seu novo nome:");
            if(n && usuarioAtual) {
                document.getElementById('profile-name').innerText = n;
                localStorage.setItem('profile_name_' + usuarioAtual.uid, n);
                salvarPerfilUsuario(usuarioAtual);
            }
        };

        window.checkEnter = function(e) { if(e.key === 'Enter') enviarMensagemTexto(); };
        document.getElementById('send-btn').onclick = enviarMensagemTexto;

        // Otimização e Compressão de Foto Ultrarrápida
        function comprimirEConverterFoto(file, callback) {
            if (!file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => callback(e.target.result, file.type, file.name);
                reader.readAsDataURL(file);
                return;
            }

            const img = new Image();
            const tempUrl = URL.createObjectURL(file);
            img.src = tempUrl;
            img.onload = () => {
                URL.revokeObjectURL(tempUrl);
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                const max = 700;

                if (width > height && width > max) { height *= max / width; width = max; }
                else if (height > max) { height *= max / height; height = max; }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
                callback(dataUrl, 'image/jpeg', file.name || 'foto.jpg');
            };
        }

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            rawSelectedFile = file;

            filePreviewZone.innerHTML = '';
            if (file.type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                filePreviewZone.appendChild(img);
            } else {
                filePreviewZone.innerHTML = `<div style="color:white; padding:20px;">📁 ${file.name}</div>`;
            }
            fileCaptionInput.value = '';
            fileModal.style.display = 'flex';
        };

        document.getElementById('confirm-file-btn').onclick = () => {
            if (!rawSelectedFile || !usuarioAtual) return;

            const isEnc = encryptCheck.checked;
            let senha = "";
            if (isEnc) {
                senha = prompt("Defina uma senha para criptografar a mídia:");
                if(!senha) return alert("Envio cancelado!");
            }

            document.getElementById('upload-status-title').innerText = "Enviando foto rápida...";

            comprimirEConverterFoto(rawSelectedFile, (dataUrl, tipo, nome) => {
                const payloadMedia = JSON.stringify({
                    isMedia: true,
                    url: dataUrl,
                    type: tipo,
                    name: nome,
                    legenda: fileCaptionInput.value.trim()
                });

                let textoFinal = isEnc ? criptografar(payloadMedia, senha) : payloadMedia;

                addDoc(collection(db, "mensagens"), {
                    autorId: usuarioAtual.uid,
                    autorNome: localStorage.getItem('profile_name_' + usuarioAtual.uid) || usuarioAtual.email.split('@')[0],
                    texto: textoFinal,
                    isEncrypted: isEnc,
                    chatId: currentChatId,
                    createdAt: serverTimestamp()
                }).then(() => {
                    tocarSom('enviada');
                    fileModal.style.display = 'none';
                    fileInput.value = '';
                    rawSelectedFile = null;
                    encryptCheck.checked = false;
                });
            });
        };

        function enviarMensagemTexto() {
            const txt = msgInput.value.trim();
            if(!txt || !usuarioAtual) return;

            const isEnc = encryptCheck.checked;
            let textoFinal = txt;

            if (isEnc) {
                const senha = prompt("Crie uma senha de proteção:");
                if(!senha) return alert("Envio cancelado!");
                textoFinal = criptografar(txt, senha);
            }

            addDoc(collection(db, "mensagens"), {
                autorId: usuarioAtual.uid,
                autorNome: localStorage.getItem('profile_name_' + usuarioAtual.uid) || usuarioAtual.email.split('@')[0],
                texto: textoFinal,
                isEncrypted: isEnc,
                chatId: currentChatId,
                createdAt: serverTimestamp()
            }).then(() => {
                tocarSom('enviada');
                msgInput.value = '';
                encryptCheck.checked = false;
                emojiPicker.style.display = 'none';
            });
        }

        function renderizarConteudo(texto, elemento) {
            if (texto.startsWith('{"isMedia":true')) {
                try {
                    const m = JSON.parse(texto);
                    if (m.type && m.type.startsWith('image/')) {
                        elemento.innerHTML = `<img src="${m.url}" alt="Foto" onclick="window.open('${m.url}', '_blank')">`;
                    } else {
                        elemento.innerHTML = `<a href="${m.url}" download="${m.name}" class="file-link">📁 ${m.name}</a>`;
                    }
                    if (m.legenda) elemento.innerHTML += `<div class="file-caption">${m.legenda}</div>`;
                } catch(e) { elemento.innerText = texto; }
            } else {
                elemento.innerText = texto;
            }
        }

        function iniciarEscutaMensagens() {
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            const q = query(collection(db, "mensagens"), orderBy("createdAt", "asc"));

            unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                chatMessages.innerHTML = '';

                snapshot.forEach((docSnap) => {
                    const d = docSnap.data();
                    const idMsg = docSnap.id;
                    const msgChatId = d.chatId || "global";

                    if (msgChatId !== currentChatId) return;

                    const msgDiv = document.createElement('div');
                    const eMeu = (usuarioAtual && d.autorId === usuarioAtual.uid);
                    msgDiv.classList.add('message', eMeu ? 'right' : 'left');

                    const btnDel = document.createElement('button');
                    btnDel.className = 'delete-btn';
                    btnDel.innerText = '✕';
                    btnDel.onclick = () => deleteDoc(doc(db, "mensagens", idMsg));
                    msgDiv.appendChild(btnDel);

                    if (!eMeu) {
                        const autorSpan = document.createElement('span');
                        autorSpan.className = 'msg-author';
                        autorSpan.innerText = d.autorNome || 'Usuário';
                        msgDiv.appendChild(autorSpan);
                    }

                    const contDiv = document.createElement('div');

                    if (d.isEncrypted) {
                        msgDiv.setAttribute('data-raw', d.texto);
                        contDiv.innerHTML = `<span class="encrypted-badge">🔒 Conteúdo Protegido (Toque para abrir)</span>`;
                        msgDiv.onclick = (e) => {
                            if(e.target.className === 'delete-btn') return;
                            const pass = prompt("Insira a senha do conteúdo:");
                            if(pass) {
                                const dec = decriptografar(msgDiv.getAttribute('data-raw'), pass);
                                if(dec !== null) {
                                    contDiv.innerHTML = '';
                                    renderizarConteudo(dec, contDiv);
                                    msgDiv.onclick = null;
                                } else {
                                    alert("Senha incorreta!");
                                }
                            }
                        };
                    } else {
                        renderizarConteudo(d.texto, contDiv);
                    }

                    msgDiv.appendChild(contDiv);

                    const horaSpan = document.createElement('span');
                    horaSpan.className = 'msg-time';
                    horaSpan.innerText = obterHora(d.createdAt);
                    msgDiv.appendChild(horaSpan);

                    chatMessages.appendChild(msgDiv);
                });

                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }
    </script>
